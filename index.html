<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGA | Gestión Social Independencia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .tab-active { border-bottom: 4px solid #1e3a8a; color: #1e3a8a; opacity: 1 !important; }
        tr:nth-child(even) { background-color: #f8fafc; }
    </style>
</head>
<body class="bg-slate-900 font-sans text-slate-900 transition-all duration-500">

    <div id="auth-screen" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm p-8 rounded-[2rem] shadow-2xl">
            <h2 class="text-2xl font-black text-blue-900 text-center mb-6">SIGA V6 PRO</h2>
            <div class="space-y-3">
                <div id="f-nom" class="hidden"><input type="text" id="reg-n" class="w-full p-3 bg-slate-50 border rounded-xl" placeholder="Nombre Sector"></div>
                <input type="text" id="a-u" class="w-full p-3 bg-slate-50 border rounded-xl" placeholder="Usuario">
                <input type="password" id="a-p" class="w-full p-3 bg-slate-50 border rounded-xl" placeholder="Clave">
                <button onclick="hAuth()" class="w-full bg-blue-900 text-white font-bold py-3 rounded-xl uppercase text-xs">Entrar</button>
            </div>
            <button onclick="tAuth()" id="t-b" class="w-full text-blue-700 font-bold text-[10px] mt-4 underline italic uppercase">Crear Perfil Nuevo</button>
        </div>
    </div>

    <div id="app" class="hidden min-h-screen bg-white">
        <nav class="bg-blue-900 text-white p-4 flex justify-between items-center shadow-lg">
            <h1 class="font-black italic">SIGA PRO</h1>
            <button onclick="location.reload()" class="text-[10px] bg-red-600 px-3 py-1 rounded-lg font-bold">SALIR</button>
        </nav>

        <div id="p-main" class="p-4 max-w-4xl mx-auto">
            <div class="grid grid-cols-2 md:grid-cols-4 gap-2 mb-6 text-center">
                <div class="bg-blue-50 p-3 rounded-xl border-b-4 border-blue-900"><p class="text-[9px] font-black uppercase">Censo</p><h3 id="s-t" class="text-xl font-bold">0</h3></div>
                <div onclick="sTab('list','espera')" class="bg-yellow-50 p-3 rounded-xl border-b-4 border-yellow-400 cursor-pointer"><p class="text-[9px] font-black uppercase">Espera</p><h3 id="s-e" class="text-xl font-bold">0</h3></div>
                <div onclick="sTab('list','aprobado')" class="bg-green-50 p-3 rounded-xl border-b-4 border-green-600 cursor-pointer"><p class="text-[9px] font-black uppercase">Aprobados</p><h3 id="s-a" class="text-xl font-bold">0</h3></div>
                <div onclick="sTab('list','rechazado')" class="bg-red-50 p-3 rounded-xl border-b-4 border-red-600 cursor-pointer"><p class="text-[9px] font-black uppercase">Negados</p><h3 id="s-r" class="text-xl font-bold">0</h3></div>
            </div>
            <button onclick="sTab('reg')" class="w-full bg-blue-900 text-white font-black p-5 rounded-2xl shadow-lg flex justify-between items-center"><span>NUEVO CENSO</span><span>➕</span></button>
        </div>

        <div id="p-reg" class="hidden p-6 max-w-xl mx-auto">
            <button onclick="sTab('main')" class="mb-4 text-blue-900 font-bold text-xs uppercase underline">← Menú</button>
            <form onsubmit="sData(event)" class="space-y-3 bg-slate-50 p-6 rounded-3xl shadow-inner border">
                <input type="text" id="rn" required class="w-full p-3 border rounded-xl" placeholder="Nombre completo">
                <input type="number" id="rc" required class="w-full p-3 border rounded-xl" placeholder="Cédula">
                <input type="tel" id="rt" required class="w-full p-3 border rounded-xl" placeholder="Teléfono">
                <input type="text" id="ra" class="w-full p-3 border rounded-xl" placeholder="Ayuda solicitada">
                <textarea id="rd" required class="w-full p-3 border rounded-xl h-20" placeholder="Dirección exacta"></textarea>
                <button type="submit" class="w-full bg-blue-900 text-white font-bold py-4 rounded-xl uppercase">Guardar Registro</button>
            </form>
        </div>

        <div id="p-list" class="hidden p-4 max-w-6xl mx-auto">
            <button onclick="sTab('main')" class="mb-4 text-blue-900 font-bold text-xs uppercase">← Menú</button>
            <div class="flex gap-4 mb-4 border-b text-[10px] font-black uppercase overflow-x-auto">
                <button onclick="fBy('espera')" id="bf-espera" class="pb-2 px-2 opacity-40">🟡 Espera</button>
                <button onclick="fBy('aprobado')" id="bf-aprobado" class="pb-2 px-2 opacity-40">🟢 Aprobados</button>
                <button onclick="fBy('rechazado')" id="bf-rechazado" class="pb-2 px-2 opacity-40">🔴 Negados</button>
            </div>
            <div class="overflow-x-auto bg-white rounded-xl shadow-xl border">
                <table class="w-full text-left text-[10px] border-collapse">
                    <thead class="bg-slate-100 uppercase italic">
                        <tr><th class="p-3">#</th><th>Nombre</th><th>CI</th><th>Teléfono</th><th>Dirección</th><th>Ayuda</th><th class="text-center">Estatus</th></tr>
                    </thead>
                    <tbody id="e-body" class="font-medium"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let isL = true, uDB = JSON.parse(localStorage.getItem('s_v6_u'))||[], rDB = JSON.parse(localStorage.getItem('s_v6_r'))||[], cU = null, cF = 'espera';
        function tAuth(){ isL = !isL; document.getElementById('f-nom').classList.toggle('hidden'); document.getElementById('t-b').innerText = isL ? "Crear Perfil Nuevo" : "Ya tengo cuenta"; }
        function hAuth(){
            const u = document.getElementById('a-u').value.trim(), p = document.getElementById('a-p').value.trim(), n = document.getElementById('reg-n').value.trim();
            if(isL){ const f = uDB.find(x => x.u === u && x.p === p); if(f){ cU = f; eApp(); } else alert("Error"); }
            else { if(u&&p&&n){ uDB.push({u,p,name:n}); localStorage.setItem('s_v6_u', JSON.stringify(uDB)); alert("Creado"); tAuth(); } }
        }
        function eApp(){ document.getElementById('auth-screen').classList.add('hidden'); document.getElementById('app').classList.remove('hidden'); document.body.className="bg-white"; uSt(); }
        function sTab(t, f = 'espera'){ ['p-main','p-reg','p-list'].forEach(x => document.getElementById(x).classList.add('hidden')); document.getElementById('p-'+t).classList.remove('hidden'); if(t==='list') fBy(f); if(t==='main') uSt(); }
        function uSt(){ const m = rDB.filter(r => r.s === cU.u); document.getElementById('s-t').innerText = m.length; document.getElementById('s-e').innerText = m.filter(r => r.e === 'espera').length; document.getElementById('s-a').innerText = m.filter(r => r.e === 'aprobado').length; document.getElementById('s-r').innerText = m.filter(r => r.e === 'rechazado').length; }
        function sData(e){ e.preventDefault(); rDB.unshift({id:Date.now(),s:cU.u,n:document.getElementById('rn').value.toUpperCase(),c:document.getElementById('rc').value,t:document.getElementById('rt').value,d:document.getElementById('rd').value,a:document.getElementById('ra').value||"Gral",e:'espera'}); localStorage.setItem('s_v6_r', JSON.stringify(rDB)); alert("Guardado"); e.target.reset(); sTab('list','espera'); }
        function cSt(id, s){ const i = rDB.findIndex(r => r.id === id); rDB[i].e = s; localStorage.setItem('s_v6_r', JSON.stringify(rDB)); fBy(cF); }
        function fBy(s){ cF = s; ['espera','aprobado','rechazado'].forEach(x => document.getElementById('bf-'+x).className = "pb-2 px-2 opacity-40"); document.getElementById('bf-'+s).classList.add('tab-active'); const b = document.getElementById('e-body'), f = rDB.filter(r => r.s === cU.u && r.e === s);
            b.innerHTML = f.map((r, i) => `<tr class="border-b"><td class="p-3 text-blue-900">${i+1}</td><td>${r.n}</td><td>${r.c}</td><td>${r.t}</td><td class="max-w-[100px] truncate">${r.d}</td><td>${r.a}</td><td class="flex gap-1 justify-center p-2"><button onclick="cSt(${r.id},'espera')" class="w-4 h-4 rounded-full bg-yellow-400"></button><button onclick="cSt(${r.id},'aprobado')" class="w-4 h-4 rounded-full bg-green-500"></button><button onclick="cSt(${r.id},'rechazado')" class="w-4 h-4 rounded-full bg-red-600"></button></td></tr>`).join('');
            if(!f.length) b.innerHTML = `<tr><td colspan="7" class="p-10 text-center opacity-30 italic font-bold">Sin registros</td></tr>`;
        }
    </script>
</body>
</html>
