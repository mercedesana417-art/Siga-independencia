<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGA-Independencia | Gestión Social</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 font-sans">

    <nav class="bg-blue-900 text-white p-4 shadow-2xl sticky top-0 z-50 flex justify-between items-center">
        <div>
            <h1 class="text-xl font-black tracking-tighter">SIGA</h1>
            <p class="text-[10px] uppercase tracking-widest text-blue-300">Independencia - Salud</p>
        </div>
        <div class="flex items-center gap-2">
            <div class="w-3 h-3 bg-green-500 rounded-full animate-pulse"></div>
            <span class="text-xs font-bold">SISTEMA OPERATIVO</span>
        </div>
    </nav>

    <div id="main-panel" class="max-w-md mx-auto p-4">
        
        <div class="grid grid-cols-2 gap-3 mb-6">
            <div class="bg-white p-4 rounded-2xl shadow-sm border-b-4 border-blue-500">
                <p class="text-gray-500 text-xs font-bold uppercase">Atendidos</p>
                <h3 class="text-2xl font-black text-blue-900" id="count-atendidos">124</h3>
            </div>
            <div class="bg-white p-4 rounded-2xl shadow-sm border-b-4 border-green-500">
                <p class="text-gray-500 text-xs font-bold uppercase">Ayudas</p>
                <h3 class="text-2xl font-black text-green-600">98%</h3>
            </div>
        </div>

        <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
            <span>🚀</span> Módulos de Gestión
        </h2>

        <div class="space-y-3">
            <button onclick="switchTab('registro')" class="w-full flex items-center p-4 bg-white rounded-2xl shadow-sm border border-slate-200 active:scale-95 transition-all">
                <div class="bg-blue-100 p-3 rounded-xl mr-4 text-xl">✍️</div>
                <div class="text-left">
                    <p class="font-bold text-slate-800">Censo de Beneficiarios</p>
                    <p class="text-xs text-slate-500">Formación y registro inicial</p>
                </div>
            </button>

            <button onclick="switchTab('lista')" class="w-full flex items-center p-4 bg-white rounded-2xl shadow-sm border border-slate-200 active:scale-95 transition-all">
                <div class="bg-purple-100 p-3 rounded-xl mr-4 text-xl">📋</div>
                <div class="text-left">
                    <p class="font-bold text-slate-800">Seguimiento y Control</p>
                    <p class="text-xs text-slate-500">Ver listado de casos registrados</p>
                </div>
            </button>

            <button onclick="alert('Generando Reporte PDF para la Alcaldía...')" class="w-full flex items-center p-4 bg-white rounded-2xl shadow-sm border border-slate-200 active:scale-95 transition-all">
                <div class="bg-orange-100 p-3 rounded-xl mr-4 text-xl">📊</div>
                <div class="text-left">
                    <p class="font-bold text-slate-800">Reportes de Impacto</p>
                    <p class="text-xs text-slate-500">Estadísticas de gestión social</p>
                </div>
            </button>
        </div>
    </div>

    <div id="registro-panel" class="hidden max-w-md mx-auto p-4">
        <button onclick="switchTab('main')" class="mb-4 text-blue-700 font-bold flex items-center gap-1">
            <span class="text-xl">‹</span> Volver al Panel
        </button>
        
        <div class="bg-white p-6 rounded-3xl shadow-xl border border-slate-200">
            <h2 class="text-xl font-black text-blue-900 mb-6">Nuevo Registro</h2>
            
            <form id="formBeneficiario" onsubmit="saveData(event)" class="space-y-4">
                <div>
                    <label class="text-[10px] font-black text-slate-400 uppercase ml-1">Nombre del Beneficiario</label>
                    <input type="text" id="nombre" required class="w-full p-3 bg-slate-50 border-2 border-slate-100 rounded-xl focus:border-blue-500 outline-none transition-all" placeholder="Ej: María Rodríguez">
                </div>
                <div>
                    <label class="text-[10px] font-black text-slate-400 uppercase ml-1">Cédula de Identidad</label>
                    <input type="number" id="cedula" required class="w-full p-3 bg-slate-50 border-2 border-slate-100 rounded-xl focus:border-blue-500 outline-none transition-all" placeholder="V-00000000">
                </div>
                <div>
                    <label class="text-[10px] font-black text-slate-400 uppercase ml-1">Tipo de Ayuda Social</label>
                    <select id="ayuda" class="w-full p-3 bg-slate-50 border-2 border-slate-100 rounded-xl focus:border-blue-500 outline-none transition-all">
                        <option>🩺 Medicinas / Salud</option>
                        <option>🍎 Alimentación (CLAP)</option>
                        <option>♿ Ayuda Técnica</option>
                        <option>🏠 Vivienda</option>
                    </select>
                </div>
                <button type="submit" class="w-full bg-blue-900 text-white font-black py-4 rounded-2xl shadow-lg hover:bg-blue-800 active:scale-95 transition-all mt-4">
                    GUARDAR EN SISTEMA
                </button>
            </form>
        </div>
    </div>

    <div id="lista-panel" class="hidden max-w-md mx-auto p-4">
        <button onclick="switchTab('main')" class="mb-4 text-blue-700 font-bold flex items-center gap-1">
            <span class="text-xl">‹</span> Volver al Panel
        </button>
        
        <h2 class="text-xl font-black text-slate-800 mb-4">Control de Casos</h2>
        <div id="contenedor-lista" class="space-y-3">
            <p class="text-center text-slate-400 py-10 italic">No hay registros nuevos hoy.</p>
        </div>
    </div>

    <script>
        let registros = [];

        function switchTab(tab) {
            document.getElementById('main-panel').classList.add('hidden');
            document.getElementById('registro-panel').classList.add('hidden');
            document.getElementById('lista-panel').classList.add('hidden');

            if(tab === 'main') document.getElementById('main-panel').classList.remove('hidden');
            if(tab === 'registro') document.getElementById('registro-panel').classList.remove('hidden');
            if(tab === 'lista') {
                document.getElementById('lista-panel').classList.remove('hidden');
                renderLista();
            }
        }

        function saveData(e) {
            e.preventDefault();
            const nuevo = {
                nombre: document.getElementById('nombre').value,
                cedula: document.getElementById('cedula').value,
                ayuda: document.getElementById('ayuda').value,
                fecha: new Date().toLocaleDateString()
            };
            
            registros.unshift(nuevo);
            document.getElementById('formBeneficiario').reset();
            alert("✅ Registro guardado con éxito en el servidor SIGA.");
            switchTab('main');
            document.getElementById('count-atendidos').innerText = 124 + registros.length;
        }

        function renderLista() {
            const lista = document.getElementById('contenedor-lista');
            if(registros.length === 0) return;
            
            lista.innerHTML = registros.map(r => `
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
                    <div class="flex justify-between items-start">
                        <div>
                            <p class="font-black text-slate-800">${r.nombre}</p>
                            <p class="text-xs text-slate-500">C.I: ${r.cedula}</p>
                        </div>
                        <span class="text-[10px] bg-blue-100 text-blue-700 px-2 py-1 rounded-lg font-bold uppercase">${r.fecha}</span>
                    </div>
                    <div class="mt-3 pt-3 border-t border-dashed flex justify-between items-center text-sm">
                        <span class="text-slate-600 font-medium">${r.ayuda}</span>
                        <span class="text-green-600 font-bold">● Entregado</span>
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
