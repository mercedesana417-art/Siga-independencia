<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGA PRO | Control de Planillas Flexibles</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .tab-active { border-bottom: 4px solid #1e3a8a; color: #1e3a8a; font-weight: 900; }
        .table-container { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .animate-fadeIn { animation: fadeIn 0.3s ease-in; }
    </style>
</head>
<body class="bg-slate-900 font-sans text-slate-900 transition-all duration-500">

    <div id="auth-screen" class="min-h-screen flex items-center justify-center p-6">
        <div class="bg-white w-full max-w-sm p-8 rounded-[2.5rem] shadow-2xl border border-blue-100">
            <div class="text-center mb-6">
                <div class="bg-blue-900 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4 text-3xl shadow-lg">🔐</div>
                <h2 class="text-2xl font-black text-blue-900 tracking-tighter">SIGA V6</h2>
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-1">Acceso Administrativo Seguro</p>
            </div>
            <div class="space-y-4">
                <input type="text" id="auth-user" class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl outline-none focus:border-blue-500 font-bold" placeholder="Usuario">
                <input type="password" id="auth-pass" class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl outline-none focus:border-blue-500" placeholder="Contraseña">
                <button onclick="handleAuth()" class="w-full bg-blue-900 text-white font-black py-4 rounded-2xl shadow-xl active:scale-95 transition-all uppercase text-xs tracking-widest">Iniciar Sesión</button>
            </div>
            <button onclick="toggleReg()" id="reg-btn" class="w-full text-blue-700 font-bold text-[10px] uppercase mt-6 underline italic">¿Nuevo Administrador? Regístrate</button>
        </div>
    </div>

    <div id="app-content" class="hidden min-h-screen bg-white">
        <nav class="bg-blue-900 text-white p-4 flex justify-between items-center shadow-lg sticky top-0 z-50">
            <div class="leading-none text-left">
                <h1 class="text-xl font-black italic">SIGA PRO</h1>
                <p id="user-display" class="text-[9px] font-black opacity-70 uppercase tracking-widest"></p>
            </div>
            <button onclick="location.reload()" class="text-[10px] font-black bg-red-600 px-3 py-1 rounded-lg border border-red-400">SALIR</button>
        </nav>

        <div id="main-panel" class="p-4 max-w-6xl mx-auto">
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6 mt-4">
                <div class="bg-blue-50 p-4 rounded-2xl border-b-4 border-blue-900 text-center">
                    <p class="text-[9px] font-black text-blue-900 uppercase italic">Total Registros</p>
                    <h3 id="stat-total" class="text-3xl font-black italic">0</h3>
                </div>
                <div onclick="switchTab('lista', 'espera')" class="bg-yellow-50 p-4 rounded-2xl border-b-4 border-yellow-500 text-center cursor-pointer hover:bg-yellow-100 transition-all">
                    <p class="text-[9px] font-black text-yellow-700 uppercase italic">En Espera</p>
                    <h3 id="stat-espera" class="text-3xl font-black italic">0</h3>
                </div>
                <div onclick="switchTab('lista', 'aprobado')" class="bg-emerald-50 p-4 rounded-2xl border-b-4 border-emerald-600 text-center cursor-pointer hover:bg-emerald-100 transition-all">
                    <p class="text-[9px] font-black text-emerald-700 uppercase italic">Aprobados</p>
                    <h3 id="stat-aprobado" class="text-3xl font-black italic">0</h3>
                </div>
                <div onclick="switchTab('lista', 'rechazado')" class="bg-red-50 p-4 rounded-2xl border-b-4 border-red-600 text-center cursor-pointer hover:bg-red-100 transition-all">
                    <p class="text-[9px] font-black text-red-700 uppercase italic">No Aprobados</p>
                    <h3 id="stat-rechazado" class="text-3xl font-black italic">0</h3>
                </div>
            </div>

            <button onclick="switchTab('registro')" class="w-full bg-blue-900 text-white font-black p-6 rounded-[2.5rem] shadow-2xl mb-8 flex justify-between items-center px-10 border-b-8 border-blue-950 active:scale-95 transition-all">
                <span class="text-sm uppercase italic tracking-widest">Crear Nueva Planilla de Registro</span>
                <span class="text-2xl">➕</span>
            </button>
        </div>

        <div id="registro-panel" class="hidden p-6 max-w-2xl mx-auto animate-fadeIn">
            <button onclick="switchTab('main')" class="mb-4 text-blue-900 font-black text-xs uppercase tracking-tighter">← Volver al Panel</button>
            <div class="bg-slate-50 p-8 rounded-[3rem] border-2 border-slate-100 shadow-inner">
                <h2 class="text-2xl font-black mb-6 italic text-blue-900 underline underline-offset-8">Formulario de Registro</h2>
                <form onsubmit="saveData(event)" class="space-y-5">
                    <div>
                        <label class="text-[10px] font-black text-blue-700 uppercase ml-2 mb-1 block tracking-widest italic">Nombre de Planilla / Comunidad</label>
                        <input type="text" id="r-planilla" required class="w-full p-4 border-2 border-blue-100 rounded-2xl font-bold text-sm outline-none focus:border-blue-900" placeholder="Ej: Planilla 001 - Sector Las Flores">
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <input type="text" id="r-nombre" required class="p-4 border rounded-2xl font-bold text-sm" placeholder="Nombre y Apellido">
                        <input type="number" id="r-cedula" required class="p-4 border rounded-2xl font-bold text-sm" placeholder="Cédula de Identidad">
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <input type="tel" id="r-telefono" required class="p-4 border rounded-2xl font-bold text-sm" placeholder="Número de Teléfono">
                        <input type="text" id="r-ayuda" class="p-4 border rounded-2xl font-bold text-sm" placeholder="Ayuda o Trámite Solicitado">
                    </div>
                    <textarea id="r-direccion" required class="w-full p-4 border rounded-2xl font-bold text-sm h-20" placeholder="Dirección detallada de habitación"></textarea>
                    <button type="submit" class="w-full bg-blue-900 text-white font-black py-5 rounded-2xl uppercase shadow-xl tracking-widest mt-2 border-b-4 border-blue-950">Respaldar y Guardar Caso</button>
                </form>
            </div>
        </div>

        <div id="lista-panel" class="hidden p-4 max-w-7xl mx-auto animate-fadeIn">
            <button onclick="switchTab('main')" class="mb-4 text-blue-900 font-black text-xs uppercase italic">← Regresar</button>
            
            <div class="flex gap-4 mb-4 border-b-2 border-slate-100 overflow-x-auto pb-2">
                <button onclick="filterBy('espera')" id="btn-f-espera" class="pb-2 text-[10px] font-black uppercase px-4 transition-all opacity-40 italic">🟡 Por Procesar</button>
                <button onclick="filterBy('aprobado')" id="btn-f-aprobado" class="pb-2 text-[10px] font-black uppercase px-4 transition-all opacity-40 italic">🟢 Aprobados</button>
                <button onclick="filterBy('rechazado')" id="btn-f-rechazado" class="pb-2 text-[10px] font-black uppercase px-4 transition-all opacity-40 italic">🔴 Rechazados</button>
            </div>

            <div class="table-container bg-white rounded-3xl shadow-2xl border border-slate-200">
                <table class="w-full text-left text-[11px] font-bold border-collapse">
                    <thead class="bg-blue-900 text-white uppercase italic">
                        <tr>
                            <th class="p-4">#</th>
                            <th class="p-4">Planilla / Lugar</th>
                            <th class="p-4">Nombre Completo</th>
                            <th class="p-4">C.I</th>
                            <th class="p-4">Teléfono</th>
                            <th class="p-4">Dirección</th>
                            <th class="p-4 text-center">Estatus</th>
                        </tr>
                    </thead>
                    <tbody id="excel-body" class="text-slate-700">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let isLoginMode = true;
        let usuariosDB = JSON.parse(localStorage.getItem('siga_v6_u')) || [];
        let registrosDB = JSON.parse(localStorage.getItem('siga_v6_r')) || [];
        let currentUser = null;
        let currentFilter = 'espera';

        function toggleReg() {
            isLoginMode = !isLoginMode;
            document.getElementById('reg-btn').innerText = isLoginMode ? "¿Nuevo Administrador? Regístrate" : "Ya tengo cuenta, entrar";
        }

        function handleAuth() {
            const u = document.getElementById('auth-user').value.trim();
            const p = document.getElementById('auth-pass').value.trim();
            if(!u || !p) return alert("Complete los campos");

            if(isLoginMode) {
                const found = usuariosDB.find(x => x.u === u && x.p === p);
                if(found) { currentUser = found; enterApp(); } else alert("Acceso Denegado");
            } else {
                usuariosDB.push({ u, p });
                localStorage.setItem('siga_v6_u', JSON.stringify(usuariosDB));
                alert("Usuario registrado con éxito"); toggleReg();
            }
        }

        function enterApp() {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('app-content').classList.remove('hidden');
            document.body.classList.replace('bg-slate-900', 'bg-white');
            document.getElementById('user-display').innerText = `ADMIN: ${currentUser.u}`;
            updateStats();
        }

        function switchTab(tab, filter = 'espera') {
            ['main', 'registro', 'lista'].forEach(t => document.getElementById(t + '-panel').classList.add('hidden'));
            document.getElementById(tab + '-panel').classList.remove('hidden');
            if(tab === 'lista') filterBy(filter);
            if(tab === 'main') updateStats();
            window.scrollTo(0,0);
        }

        function updateStats() {
            const misReg = registrosDB.filter(r => r.admin === currentUser.u);
            document.getElementById('stat-total').innerText = misReg.length;
            document.getElementById('stat-espera').innerText = misReg.filter(r => r.estatus === 'espera').length;
            document.getElementById('stat-aprobado').innerText = misReg.filter(r => r.estatus === 'aprobado').length;
            document.getElementById('stat-rechazado').innerText = misReg.filter(r => r.estatus === 'rechazado').length;
        }

        function saveData(e) {
            e.preventDefault();
            const nuevo = {
                id: Date.now(),
                admin: currentUser.u,
                planilla: document.getElementById('r-planilla').value,
                nombre: document.getElementById('r-nombre').value,
                cedula: document.getElementById('r-cedula').value,
                telefono: document.getElementById('r-telefono').value,
                direccion: document.getElementById('r-direccion').value,
                ayuda: document.getElementById('r-ayuda').value || "General",
                estatus: 'espera'
            };
            registrosDB.unshift(nuevo);
            localStorage.setItem('siga_v6_r', JSON.stringify(registrosDB));
            alert("✅ PLANILLA RESPALDADA");
            e.target.reset();
            switchTab('lista', 'espera');
        }

        function changeStatus(id, stat) {
            const idx = registrosDB.findIndex(r => r.id === id);
            registrosDB[idx].estatus = stat;
            localStorage.setItem('siga_v6_r', JSON.stringify(registrosDB));
            filterBy(currentFilter);
        }

        function filterBy(stat) {
            currentFilter = stat;
            ['espera', 'aprobado', 'rechazado'].forEach(s => document.getElementById('btn-f-'+s).classList.remove('tab-active', 'opacity-100'));
            document.getElementById('btn-f-'+stat).classList.add('tab-active', 'opacity-100');
            
            const tbody = document.getElementById('excel-body');
            const filtrados = registrosDB.filter(r => r.admin === currentUser.u && r.estatus === stat);
            
            tbody.innerHTML =
